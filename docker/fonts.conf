<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- design.yaml のフォント名を描画環境のフォントへ解決する別名定義 -->
<fontconfig>
  <alias binding="same">
    <family>Noto Sans JP</family>
    <prefer><family>Noto Sans CJK JP</family></prefer>
  </alias>
  <!-- 等幅列（design v0.2 monospace_columns）の既定書体。Windows の Consolas と同じく等幅の字形で描く（フォントは同梱しない） -->
  <alias binding="same">
    <family>Consolas</family>
    <prefer><family>Noto Sans Mono CJK JP</family></prefer>
  </alias>
</fontconfig>
