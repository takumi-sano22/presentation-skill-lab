name: Validate sources
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate example inputs
        run: |
          for d in design design-dark; do
            python scripts/validate.py \
              --content examples/technical-architecture/content.yaml \
              --design examples/technical-architecture/$d.yaml \
              --public-repo-check
          done
      - name: Convert example to outline.json (adapter)
        run: >-
          python scripts/adapter.py
          --content examples/technical-architecture/content.yaml
          --design examples/technical-architecture/design.yaml
          --output build/outline.json
      - name: Test validator / adapter regressions
        run: python -m unittest discover -s tests -v
  toolchain:
    # 上流固定・描画ツールチェーンを Docker イメージ内で検査する（ローカルの scripts/dev.sh と同一経路）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build render toolchain image
        run: scripts/dev.sh build
      - name: Doctor
        run: scripts/dev.sh run python3 scripts/doctor.py
      - name: Tests in toolchain image
        run: scripts/dev.sh run python3 -m unittest discover -s tests -v
      - name: Build sample deck (PPTX / PDF / PNG / gallery)
        run: >-
          scripts/build
          --content examples/technical-architecture/content.yaml
          --design examples/technical-architecture/design.yaml
          --out build/sample-cloud-architecture
      - name: Build same content with dark theme (design only)
        run: >-
          scripts/build
          --content examples/technical-architecture/content.yaml
          --design examples/technical-architecture/design-dark.yaml
          --out build/sample-dark
      - name: Upload sample decks
        uses: actions/upload-artifact@v4
        with:
          name: sample-decks
          path: |
            build/sample-cloud-architecture
            build/sample-dark
          retention-days: 14
