name: Validate sources
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate example inputs
        run: |
          for d in design design-dark; do
            python scripts/validate.py \
              --content examples/technical-architecture/content.yaml \
              --design examples/technical-architecture/$d.yaml \
              --public-repo-check
          done
      - name: Check image assets (rights / provenance / integrity)
        run: python scripts/assets.py examples/*/
      - name: Validate benchmark decks
        run: |
          for d in bench-architecture bench-table-chart bench-dense-tech; do
            python scripts/validate.py --content examples/$d/content.yaml --design examples/$d/design.yaml --public-repo-check
          done
      - name: Validate Gate 4-B (ChatGPT content / Claude design)
        run: >-
          python scripts/validate.py
          --content examples/gate4-chatgpt-origin/content.yaml
          --design examples/gate4-chatgpt-origin/design.yaml
          --public-repo-check
      - name: Validate ER example (schema v0.2)
        run: >-
          python scripts/validate.py
          --content examples/bench-er/content.yaml
          --design examples/bench-er/design.yaml
          --public-repo-check
      - name: Validate asset example
        run: >-
          python scripts/validate.py
          --content examples/asset-illustration/content.yaml
          --design examples/asset-illustration/design.yaml
          --public-repo-check
      - name: Convert example to outline.json (adapter)
        run: >-
          python scripts/adapter.py
          --content examples/technical-architecture/content.yaml
          --design examples/technical-architecture/design.yaml
          --output build/outline.json
      - name: Test validator / adapter regressions
        run: python -m unittest discover -s tests -v
  toolchain:
    # 上流固定・描画ツールチェーンを Docker イメージ内で検査する（ローカルの scripts/dev.sh と同一経路）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build render toolchain image
        run: scripts/dev.sh build
      - name: Doctor
        run: scripts/dev.sh run python3 scripts/doctor.py
      - name: Tests in toolchain image
        run: scripts/dev.sh run python3 -m unittest discover -s tests -v
      - name: Build sample deck (PPTX / PDF / PNG / gallery)
        run: >-
          scripts/build
          --content examples/technical-architecture/content.yaml
          --design examples/technical-architecture/design.yaml
          --out build/sample-cloud-architecture
      - name: Build same content with dark theme (design only)
        run: >-
          scripts/build
          --content examples/technical-architecture/content.yaml
          --design examples/technical-architecture/design-dark.yaml
          --out build/sample-dark
      - name: Gate 4-A - ChatGPT design-only render
        run: >-
          scripts/build
          --content examples/technical-architecture/content.yaml
          --design examples/technical-architecture/design-chatgpt.yaml
          --out build/gate4-chatgpt-design
      - name: Gate 4-A - content lock and design diff
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path("build/sample-cloud-architecture/manifest.json").read_text())
          cand = json.loads(Path("build/gate4-chatgpt-design/manifest.json").read_text())
          assert base["inputs"]["content"]["sha256"] == cand["inputs"]["content"]["sha256"], "ChatGPT design edit changed content"
          assert base["inputs"]["design"]["sha256"] != cand["inputs"]["design"]["sha256"], "Design override has no distinct source"
          for key in ("content_missing_in_pptx", "content_missing_in_pdf", "diagram_errors", "media_errors", "font_errors"):
              assert not cand["checks"][key], f"{key}: {cand['checks'][key]}"
          assert not cand["checks"]["qa"]["errors"], cand["checks"]["qa"]["errors"]
          assert cand["slides"] == base["slides"] == 6
          assert Path("build/gate4-chatgpt-design/deck.pptx").is_file()
          assert Path("build/gate4-chatgpt-design/deck.pdf").is_file()
          print("PASS Gate4-A: same content, changed design, 6-slide PPTX/PDF/PNG, QA no critical errors")
          PY
      - name: Gate 4-B - Claude design for ChatGPT-origin content
        run: >-
          scripts/build
          --content examples/gate4-chatgpt-origin/content.yaml
          --design examples/gate4-chatgpt-origin/design.yaml
          --out build/gate4-chatgpt-origin
      - name: Gate 4-B - content lock and render checks
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          raw = hashlib.sha256(Path("examples/gate4-chatgpt-origin/content.yaml").read_bytes()).hexdigest()
          assert raw == "9bd19d849fa0db9ce9881f15d80948284266d152eee61826b4415ad49f8abcb8", "ChatGPT-origin content changed"
          m = json.loads(Path("build/gate4-chatgpt-origin/manifest.json").read_text())
          for key in ("content_missing_in_pptx", "content_missing_in_pdf", "diagram_errors", "media_errors", "font_errors"):
              assert not m["checks"][key], f"{key}: {m['checks'][key]}"
          assert not m["checks"]["qa"]["errors"], m["checks"]["qa"]["errors"]
          assert m["slides"] == 6
          print("content_sha256", m["inputs"]["content"]["sha256"], "design_sha256", m["inputs"]["design"]["sha256"])
          print("PASS Gate4-B: ChatGPT content unchanged, Claude design, 6-slide PPTX/PDF/PNG, QA no critical errors")
          PY
      - name: Build ER example (native ER + SVG exception)
        run: >-
          scripts/build
          --content examples/bench-er/content.yaml
          --design examples/bench-er/design.yaml
          --out build/sample-er
      - name: ER example - native objects and recorded SVG exception
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          m = json.loads(Path("build/sample-er/manifest.json").read_text())
          assert not m["checks"]["diagram_errors"] and not m["checks"]["qa"]["errors"], m["checks"]
          assert "e402" not in m["fallbacks"], "small ER must stay native"
          fb = m["fallbacks"]["e403"]
          assert fb["mode"] == "svg" and fb["reason"] and fb["source_sha256"] and fb["svg_sha256"], fb
          xml = zipfile.ZipFile("build/sample-er/deck.pptx").read("ppt/slides/slide2.xml").decode()
          assert "<p:pic>" not in xml and xml.count('name="er-attr:') == 16, "native ER shapes"
          print("PASS ER: e402 native (16 attribute rows as text shapes, no picture), e403 SVG exception recorded:", fb["reason"][:60])
          PY
      - name: Build asset illustration example
        run: >-
          scripts/build
          --content examples/asset-illustration/content.yaml
          --design examples/asset-illustration/design.yaml
          --out build/sample-asset-illustration
      - name: Visual benchmark (3 decks x initial / theme / text increase)
        run: scripts/dev.sh run python3 scripts/benchmark.py
      - name: Upload benchmark gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: build/benchmark
          retention-days: 14
      - name: Upload sample decks
        uses: actions/upload-artifact@v4
        with:
          name: sample-decks
          path: |
            build/sample-cloud-architecture
            build/sample-dark
            build/gate4-chatgpt-design
            build/gate4-chatgpt-origin
            build/sample-er
            build/sample-asset-illustration
          retention-days: 14
